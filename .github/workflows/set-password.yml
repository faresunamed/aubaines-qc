name: Changer un mot de passe
on:
  workflow_dispatch:
    inputs:
      email:
        description: Courriel du compte
        required: true
        default: faresbenyounes@gmail.com
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/set-password.ts "$EMAIL"
        env:
          EMAIL: ${{ inputs.email }}
          NEW_PASSWORD: ${{ secrets.NEW_PASSWORD }}   # secret du dépôt : masqué dans les journaux
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
